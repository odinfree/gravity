[package]
name = "prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SNIP-36 proving for signed Starknet transactions using stwo."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

# Unix-only: kill the prover CLI's process group (reap the runner it spawns) on
# timeout/failure so it can't leak its port. Mirrors ../dinner's approach.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
