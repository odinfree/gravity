[workspace]
resolver = "2"
members = ["crates/wallet-core", "crates/wallet-rpc", "crates/wallet-cli", "crates/prover"]
# The desktop (Tauri) app is its own crate under desktop/src-tauri; keep it out
# of this workspace so `cargo build` of the core stays lean and toolchain-free
# (mirrors ../dinner).
exclude = [".probe", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/odinfree/gravity"

# krusty-kms is experimental and not published to crates.io. Pin to an exact
# commit; bumps must go through review (see spec/wallet-companion-spec.md §14).
# Backport strkd #34: canonical SNIP-12 string/selector hashing. Gravity retains
# its existing account paths, public-key salt, v1 vault and viewing-key v1.
# tests/legacy_compatibility.rs pins pre-upgrade identities and signatures.
# Known upstream limit: i128 accepts negative JSON numbers only (fails closed).
[workspace.dependencies]
krusty-kms = { git = "https://github.com/starknet-innovation/krusty-kms", rev = "2b6b7b5ea0ef33e3e088402ae9f65828b23a3b5f" }
krusty-kms-common = { git = "https://github.com/starknet-innovation/krusty-kms", rev = "2b6b7b5ea0ef33e3e088402ae9f65828b23a3b5f" }
# Must match krusty-kms's Felt type to avoid version-skew mismatches.
starknet-types-core = { version = "0.2.0", features = ["hash"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: re-serialising a contract-class ABI must reproduce the compiler's
# byte-exact JSON (key order included) or the derived class hash is wrong.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
# Vault crypto — mainstream, audited; independent of krusty internals.
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
sha3 = "0.10"
# wallet-rpc + prover (prover spawns the SNIP-36 CLI → needs "process")
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "process"] }
async-trait = "0.1"
axum = "0.7"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
# wallet-cli
clap = { version = "4", features = ["derive"] }
dirs = "5"
# prover (cfg(unix) only) — reap the SNIP-36 CLI's process group on timeout/failure
# so a leaked runner can't outlive the job and hold its port.
libc = "0.2"

# ---------------------------------------------------------------------------
# Distribution — cargo-dist (https://opensource.axo.dev/cargo-dist/).
#
# This block is the policy: which installers, which targets, where the Homebrew
# formula lands. It is NOT complete on its own — run `dist init` once to pin
# `cargo-dist-version` (to whatever `dist` you have installed) and to GENERATE
# `.github/workflows/release.yml`. Never hand-edit that workflow; re-run
# `dist generate` after changing anything here. Only `gravity` (wallet-cli) is a
# binary, so it's the sole shipped artifact.
# ---------------------------------------------------------------------------
[workspace.metadata.dist]
# Build installers for these. A tagged release (e.g. `v0.1.0`) triggers CI.
installers = ["shell"]
# Prebuilt binaries: Apple silicon + Intel macOS, x86_64 + arm64 Linux.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ci = "github"
# Don't auto-publish; cut releases deliberately while gravity is alpha.
install-updater = false

# Optimized release builds for the shipped binary.
[profile.dist]
inherits = "release"
lto = "thin"
