name: gravity desktop draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag
        required: true
        default: gravity-v0.1.0-alpha
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix privacy ci && npm --prefix desktop ci
      - name: Build self-hosted-prover app and attach to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --config tauri.self-hosted.conf.json --bundles app --no-sign
          tagName: ${{ inputs.tag }}
          releaseName: gravity ${{ inputs.tag }}
          releaseDraft: true
          prerelease: true
          releaseBody: Experimental unsigned build. Requires Node.js 24+ and your own prover/discovery services. Read the privacy guide and DYOR. Not independently audited.
